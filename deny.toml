# cargo-deny — dependency policy. Run: cargo deny check

[advisories]
version = 2
yanked = "deny"
# "unmaintained" notices (not vulnerabilities) from Tauri/wry's own dependency
# tree — GTK3 bindings (wry's Linux webview backend) and a few small
# transitive crates. We don't control these; revisit on a Tauri/wry upgrade
# that drops them. None are exploitable-vulnerability advisories.
ignore = [
    # gtk-rs GTK3 bindings, via tauri-runtime-wry (Linux webview backend)
    "RUSTSEC-2024-0411", "RUSTSEC-2024-0412", "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414", "RUSTSEC-2024-0415", "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417", "RUSTSEC-2024-0418", "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # unic-* unicode crates, via urlpattern -> tauri-utils
    "RUSTSEC-2025-0075", "RUSTSEC-2025-0080", "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098", "RUSTSEC-2025-0100",
    # small transitive proc-macro helpers
    "RUSTSEC-2024-0370", "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Permissive licenses acceptable for a distributed desktop app. Add with justification.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # `webpki-root-certs` (via reqwest's `rustls` feature -> rustls-platform-verifier, task
    # 0011's NativeDownloader) — a data-only crate bundling Mozilla's root CA list under CDLA,
    # not source code under a copyleft term. Permissive in effect for a distributed app.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
exceptions = []
# Our own workspace crates (`publish = false`, MIT) aren't distributed as
# packages, so skip them here — the repo LICENSE is what applies.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own workspace crates reference each other by path with no version
# constraint (`emu-core = { path = "crates/emu-core" }`) — that is exactly
# what `wildcards = "deny"` exists to catch for *published* crates, but we
# never publish (`publish = false`), so exempt path dependencies specifically.
allow-wildcard-paths = true
# emu-core must not pull tauri transitively (belt-and-braces with scripts/emu-core-no-tauri.sh)
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
