config:
  default: true
  MD013: false   # line length — prose is hard-wrapped by hand, not enforced
  MD024:
    siblings_only: true   # allow repeated headings (e.g. "Consequences") across ADRs
  MD033: false   # inline HTML allowed (design docs)
  MD041: false   # first line need not be a top-level heading (front matter)

globs:
  - "**/*.md"

ignores:
  - node_modules
  - target
  - ".agent/templates/**"
  - "docs/design/**"
  - CHANGELOG.md
