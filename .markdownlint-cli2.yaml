config:
  default: true
  MD013: false   # line length — prose is hard-wrapped by hand, not enforced
  MD024:
    siblings_only: true   # allow repeated headings (e.g. "Consequences") across ADRs
  MD033: false   # inline HTML allowed (design docs)
  MD041: false   # first line need not be a top-level heading (front matter)
  # Formatting nits that fire on the existing hand-written docs. Off for now;
  # re-enable after a dedicated docs-formatting pass.
  MD022: false   # blanks around headings
  MD028: false   # blank line inside blockquote
  MD031: false   # blanks around fenced code
  MD032: false   # blanks around lists
  MD036: false   # emphasis used instead of heading
  MD040: false   # fenced code language

globs:
  - "**/*.md"

ignores:
  - node_modules
  - target
  - ".agent/templates/**"
  - "docs/design/**"
  - CHANGELOG.md
