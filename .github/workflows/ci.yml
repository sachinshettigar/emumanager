name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap ubuntu-only smoke test: catches state.json/task-file drift, a gross
  # schema break, or emu-core gaining a tauri dep, in seconds — before paying
  # for the 3-OS matrix below.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/progress-check.mjs
      - run: node scripts/validate-schema.mjs
      - run: bash scripts/emu-core-no-tauri.sh

  gate:
    needs: fast
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: validate
        run: just validate
      - name: build (debug, unsigned)
        run: pnpm tauri build --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: src-tauri/target/debug/bundle/
          if-no-files-found: ignore
