name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap ubuntu-only smoke test: catches state.json/task-file drift, a gross
  # schema break, or emu-core gaining a tauri dep, in seconds — before paying
  # for the 3-OS matrix below.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/progress-check.mjs
      - run: node scripts/validate-schema.mjs
      - run: bash scripts/emu-core-no-tauri.sh

  gate:
    needs: fast
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Cold Windows builds (MSVC toolchain, no warm rust-cache yet) can run
    # long; Swatinem/rust-cache makes subsequent runs much faster.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: validate
        run: just validate
      - name: build (debug, unsigned)
        run: pnpm tauri build --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: src-tauri/target/debug/bundle/
          if-no-files-found: ignore

  # E2E smoke via tauri-driver + WebdriverIO (task 0030). Linux/Windows only —
  # tauri-driver has no macOS support. The deferred M2-M5 "real boot" DoD lines
  # flip once this runs green, which it will not until the account's GitHub
  # Actions billing block is lifted (see M0 / MILESTONES.md).
  e2e:
    needs: fast
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: WebKitWebDriver (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y webkit2gtk-driver
      - name: install tauri-driver
        run: cargo install tauri-driver --locked
      - name: e2e smoke
        run: just e2e
