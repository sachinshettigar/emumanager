<svg width="960" height="230" viewBox="0 0 960 230" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans','Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- arrows -->
  <path d="M300 115 h60" stroke="#6f6e69" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M352 107 l12 8 -12 8" stroke="#6f6e69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M620 115 h60" stroke="#6f6e69" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M672 107 l12 8 -12 8" stroke="#6f6e69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- step 1 -->
  <g filter="url(#s)">
    <rect x="12" y="24" width="288" height="182" rx="14" fill="#201f1d" stroke="#3d3b35" stroke-width="1"/>
    <rect x="12" y="24" width="288" height="6" rx="3" fill="#6aa4dd"/>
  </g>
  <rect x="34" y="52" width="34" height="52" rx="6" stroke="#6aa4dd" stroke-width="4"/>
  <path d="M44 92 v10 h14 v-10 Z" fill="#6aa4dd"/>
  <text x="86" y="70" font-size="19" font-weight="700" fill="#f2f1ee">Choose</text>
  <text x="86" y="94" font-size="13" fill="#a6a49d">Step 1</text>
  <text x="34" y="140" font-size="14.5" fill="#c9c7c0">
    <tspan x="34" dy="0">Pick a device and an</tspan>
    <tspan x="34" dy="20">Android version. Images</tspan>
    <tspan x="34" dy="20">you already have are</tspan>
    <tspan x="34" dy="20">marked ready.</tspan>
  </text>

  <!-- step 2 -->
  <g filter="url(#s)">
    <rect x="336" y="24" width="288" height="182" rx="14" fill="#201f1d" stroke="#3d3b35" stroke-width="1"/>
    <rect x="336" y="24" width="288" height="6" rx="3" fill="#d0a44f"/>
  </g>
  <path d="M375 54 v30 M363 74 l12 12 12 -12 M361 96 h28" stroke="#d0a44f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="404" y="70" font-size="19" font-weight="700" fill="#f2f1ee">Prepare</text>
  <text x="404" y="94" font-size="13" fill="#a6a49d">Step 2 · automatic</text>
  <text x="358" y="140" font-size="14.5" fill="#c9c7c0">
    <tspan x="358" dy="0">Emulator Studio fetches</tspan>
    <tspan x="358" dy="20">just the SDK pieces it</tspan>
    <tspan x="358" dy="20">needs into its own folder</tspan>
    <tspan x="358" dy="20">— no Android Studio.</tspan>
  </text>

  <!-- step 3 -->
  <g filter="url(#s)">
    <rect x="660" y="24" width="288" height="182" rx="14" fill="#201f1d" stroke="#3d3b35" stroke-width="1"/>
    <rect x="660" y="24" width="288" height="6" rx="3" fill="#57b487"/>
  </g>
  <circle cx="699" cy="75" r="21" stroke="#57b487" stroke-width="4"/>
  <path d="M693 64 v22 l18 -11 Z" fill="#57b487"/>
  <text x="732" y="70" font-size="19" font-weight="700" fill="#f2f1ee">Run</text>
  <text x="732" y="94" font-size="13" fill="#a6a49d">Step 3</text>
  <text x="682" y="140" font-size="14.5" fill="#c9c7c0">
    <tspan x="682" dy="0">Launch it and watch the</tspan>
    <tspan x="682" dy="20">logs. Export the setup</tspan>
    <tspan x="682" dy="20">as a .emuprofile to hand</tspan>
    <tspan x="682" dy="20">to a teammate.</tspan>
  </text>
</svg>
