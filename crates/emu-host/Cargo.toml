[package]
name = "emu-host"
description = "Host + accelerator inspection (KVM / WHPX / AEHD / HVF), disk and memory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[dependencies]
emu-core.workspace = true
# `#[async_trait]` on `impl HostProbe for NativeHostProbe` — same version the port traits use.
async-trait = "0.1"
# RAM total + free disk on the data volume, cross-platform without a per-OS syscall of our own.
# `system` + `disk` only (no network/component/user); `0.36` is the last release for rustc 1.82.
sysinfo = { version = "0.36", default-features = false, features = ["system", "disk"] }
