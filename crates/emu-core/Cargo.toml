[package]
name = "emu-core"
description = "EmuManager domain logic. Must not depend on `tauri` (AGENTS.md §6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
# The registry (task 0018) stores compound values — `Hardware`, `EmulatorSource`, tag lists — as
# JSON text columns rather than one SQL column per field, so the full struct round-trips without a
# migration every time a field is added.
serde_json.workspace = true
async-trait = "0.1"
time = { version = "0.3", default-features = false, features = [
    "std",
    "macros",
    "parsing",
    "formatting",
    "serde-well-known",
] }
url = { version = "2", features = ["serde"] }
sha2 = "0.10"
# Local registry DB. `sqlite` bundles SQLite (no system lib); `migrate` + `macros`
# give `sqlx::migrate!` (compile-time embed — no DATABASE_URL). Queries are
# runtime-checked (`query` + manual `SqliteRow::try_get`, not `query!`), so there
# is no `.sqlx/` offline cache. Deferred to M4 (task 0018 Notes): runtime queries
# against a bundled SQLite work fine and `just validate` is green without it;
# adopting `query!` would need a build-time DB or a committed `.sqlx/` for every query.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
# Extracting downloaded SDK component archives (task 0012). `deflate` (pure-Rust, via `flate2`) is
# the only codec every real Google SDK archive we extract actually uses — checked against the
# component zips themselves, not guessed. No encryption/write support needed: we only ever read.
zip = { version = "2", default-features = false, features = ["deflate"] }
# SHA-1 verification of downloaded components: Google's repository manifest (task 0010) only
# publishes SHA-1, while `ports::Downloader::fetch` verifies SHA-256 — task 0012 re-hashes the
# downloaded bytes with this crate at the call site rather than changing the `Downloader` trait.
sha1 = "0.10"
# `tokio::task::spawn_blocking` for the (synchronous, real-filesystem) archive extraction step, so
# it doesn't block the async runtime. Already a real transitive dependency via sqlx's
# `runtime-tokio` feature; declared directly for clarity, `rt` is all this crate's own code needs.
tokio = { version = "1", default-features = false, features = ["rt"] }
# EmulatorId::generate() (task 0015) — real ULIDs (https://github.com/ulid/spec), lexicographically
# sortable by creation time. No unsafe, no dependencies of its own.
ulid = "1"

[features]
# Enables the in-crate fakes for the port traits (FakeProcessRunner, FakeDownloader,
# FakeClock, InMemoryFs). Off by default; turned on by tests and downstream test code.
testing = []

[dev-dependencies]
emu-core = { path = ".", features = ["testing"] }
serde_json.workspace = true
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "process",
    "fs",
    "io-util",
] }
tempfile = "3"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
# Real (non-fake) `Fs`/`Downloader`/`ProcessRunner` for the `#[ignore]`d integration test only —
# a small, test-local stand-in for `src-tauri`'s `NativeDownloader` (task 0011): `emu-core` can't
# depend on the `src-tauri` binary crate itself (AGENTS.md §6.1 — `tauri` never flows the other
# way), so this test proves the same real HTTP+filesystem+process path with its own minimal impls
# rather than pulling in `src-tauri`.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# `emu-android`'s real catalog parser (task 0010), so the integration test resolves today's actual
# `cmdline-tools`/`platform-tools` archives instead of a hardcoded URL. A dev-dependency cycle
# (emu-android depends on emu-core normally; emu-core dev-depends on emu-android for its own
# tests) is an explicitly supported Cargo pattern — it only affects test builds, not the library
# emu-android links against.
emu-android.workspace = true
# Schema-sync test only (task 0022): validates the `EmuProfile` serde model's own round-tripped
# JSON against `schemas/emuprofile/v1.schema.json`, so a model field that drifts from the schema
# fails a test rather than shipping. `default-features = false` drops its `reqwest`/`resolve-http`
# ($id remote-ref) feature — the schema is a local file with only internal refs. Dev-only; runtime
# schema validation is the frontend's `ajv` (`scripts/validate-schema.mjs`).
jsonschema = { version = "0.33", default-features = false }
