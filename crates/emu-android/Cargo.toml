[package]
name = "emu-android"
description = "Android provider: drives sdkmanager / avdmanager / emulator / adb."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
emu-core.workspace = true
url = { version = "2", features = ["serde"] }
# DOM parser for Google's SDK repository manifest (crates/emu-android/src/catalog.rs). A simple
# tree walk fits the manifest's shape (find-by-attribute, then read a few children) better than
# quick-xml's streaming/serde model; no unsafe, no dependencies of its own.
roxmltree = "0.21"
# `#[async_trait]` on `impl Provider for AndroidProvider` (task 0015) — same version emu-core's
# own port traits already use.
async-trait = "0.1"
# `devices::parse_from_jar` (task 0017) reads the device-definition XML out of cmdline-tools'
# `sdklib.core.jar` (a plain zip). Read-only, `deflate` only — same knobs emu-core sets.
zip = { version = "2", default-features = false, features = ["deflate"] }
# `launch`'s boot-poll loop (task 0016): `time` for `sleep`/`timeout`/`Instant`, `sync` for the
# `Mutex` guarding the spawned-emulator child handles `stop` reaps. No `rt`/`macros` — this crate
# never starts a runtime, only runs on the caller's.
tokio = { version = "1", default-features = false, features = ["time", "sync"] }
# `OffsetDateTime::now_utc()` for the timestamps on a new `EmulatorRow` (task 0018). Already a
# transitive dep via emu-core; declared here for the one `now_utc()` call `create` makes.
time = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
# `emu_core::testing`'s in-memory fakes (FakeProcessRunner, InMemoryFs) for AndroidProvider's own
# unit tests — an extra dev-dependency entry on the same crate solely to flip on its `testing`
# feature, the same pattern emu-core's own Cargo.toml uses on itself.
emu-core = { path = "../emu-core", features = ["testing"] }
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"
