[package]
name = "emumanager"
description = "EmuManager desktop app (Tauri shell)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "emumanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
emu-core.workspace = true
emu-android.workspace = true
emu-host.workspace = true

# Typed Rust<->TS IPC seam. Pinned together: tauri-specta pins `specta` with `=`,
# and `specta-typescript` must match the `specta` it was built against. Bump all
# three in one commit (AGENTS.md §2 — the IPC seam is typed).
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Real port implementations (src-tauri/src/ports/ — task 0011). Versions left unpinned to
# whatever Tauri's own dependency tree already resolves (tokio 1.53, reqwest 0.13 per
# Cargo.lock) rather than introducing a second copy.
async-trait = "0.1"
url = { version = "2", features = ["serde"] }
sha2 = "0.10"
futures-util = "0.3"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["process", "fs", "rt-multi-thread", "macros", "io-util", "sync", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
# Self-update from GitHub Releases, verified against the Ed25519 pubkey in `tauri.conf.json`
# (ADR 0007 — OS installers are unsigned, the updater is not). `release.yml` produces the
# `latest.json` + `.sig` artifacts it consumes.
tauri-plugin-updater = "2"

# Logging (task 0029). `AGENTS.md` §7: `tracing`, never `println!`. A daily-rotating file layer
# in the data dir + a stderr layer in debug; `EnvFilter` from `RUST_LOG` else `info`.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# Writing the redacted `export_diagnostics` bundle. Read-only elsewhere, but the shell needs
# write + deflate here. Same major as `emu-core`/`emu-android`.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

# `emu-host` was ignored here until task 0026 wired `NativeHostProbe` into `commands::host`;
# `emu-android` similarly until task 0013. Every workspace crate now has a real `src-tauri`
# consumer, so there is no `[package.metadata.cargo-machete]` block.
