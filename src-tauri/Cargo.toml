[package]
name = "emumanager"
description = "EmuManager desktop app (Tauri shell)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "emumanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
emu-core.workspace = true
emu-android.workspace = true
emu-host.workspace = true

# Typed Rust<->TS IPC seam. Pinned together: tauri-specta pins `specta` with `=`,
# and `specta-typescript` must match the `specta` it was built against. Bump all
# three in one commit (AGENTS.md §2 — the IPC seam is typed).
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[lints]
workspace = true
